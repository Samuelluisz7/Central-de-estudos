<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b2b"><meta name="description" content="Central de Estudos — ambiente pessoal de aprendizagem e preparação para o ENEM 2026.">
<title>Central de Estudos</title>
<style>
:root{--bg:#0b1220;--panel:#121e30;--panel2:#17263b;--line:#26374e;--text:#edf3fb;--muted:#9aabc0;--gold:#d6ad68;--green:#7dc6a1;--red:#e28d8d;--blue:#83b8e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0e1929;border-right:1px solid var(--line);padding:26px 17px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid var(--line)}.mark{width:34px;height:34px;border:1px solid var(--gold);border-radius:10px;display:grid;place-items:center;color:var(--gold);font-weight:800}.brand strong{display:block;font-size:17px;letter-spacing:.04em}.brand small,.eyebrow{font-size:10px;letter-spacing:.17em;color:var(--muted)}nav{display:grid;gap:6px}nav button,.sidefoot button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:9px}nav button.active,nav button:hover,.sidefoot button:hover{background:var(--panel2);color:var(--text)}.side-note{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px}.side-note b{color:var(--gold)}.sidefoot{font-size:11px;color:var(--muted)}main{min-width:0}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:#0d1726}.top span{font-size:11px;letter-spacing:.15em;color:var(--muted)}.top button,.primary,.secondary{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:var(--panel2);color:var(--text)}.primary{background:var(--gold);border-color:var(--gold);color:#1b1a17;font-weight:700}.content{max-width:1240px;margin:auto;padding:34px}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}.heading h1{font-size:30px;letter-spacing:-.04em;margin:5px 0}.heading p{color:var(--muted);margin:0}.eyebrow{color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:19px}.metric{font-size:28px;font-weight:700;margin:8px 0 2px}.muted{color:var(--muted)}.section{margin-top:25px}.section h2{font-size:17px;margin:0 0 13px}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.bar{height:7px;border-radius:8px;background:#25354b;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--gold);border-radius:8px}.subject-list{display:grid;gap:9px}.subject{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:9px;background:#111d2e}.subject b{font-size:14px}.tag{font-size:11px;color:var(--gold);border:1px solid #685638;border-radius:20px;padding:3px 8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#0c1726;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-weight:500}.empty{padding:25px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border-left:3px solid var(--gold);background:#1b293a;color:var(--muted);border-radius:5px;font-size:13px}.mobile{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.mobile{display:inline-block}.top{padding:0 16px}.content{padding:22px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}}
@media(max-width:460px){.grid{grid-template-columns:1fr 1fr}.metric{font-size:23px}.card{padding:14px}.top span{font-size:9px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand"><div class="mark">CE</div><div><strong>CENTRAL</strong><small>DE ESTUDOS</small></div></div>
<div class="eyebrow">AMBIENTE DE APRENDIZAGEM</div>
<nav id="nav"><button class="active" data-page="inicio">⌂ &nbsp; Visão geral</button><button data-page="plano">▦ &nbsp; Plano de estudos</button><button data-page="materias">▤ &nbsp; Matérias e trilhas</button><button data-page="diagnostico">⌁ &nbsp; Diagnóstico</button><button data-page="sessoes">◷ &nbsp; Sessões registradas</button><button data-page="revisoes">↻ &nbsp; Revisões</button></nav>
<div class="side-note"><b>Princípio de estudo</b><p>Compreender, recuperar da memória, resolver e analisar erros. O tempo sentado não é a medida principal.</p></div><div class="sidefoot">CENTRAL DE ESTUDOS · ENEM 2026<br>Os registros ficam neste dispositivo.</div></aside>
<main><header class="top"><span>SEU ESPAÇO &nbsp; / &nbsp; <b id="crumb">VISÃO GERAL</b></span><div class="actions"><button class="mobile" id="menuBtn">Menu</button><button class="primary" id="quickSession">＋ Registrar sessão</button></div></header>
<div class="content" id="view"></div></main></div>
<script>
const subjects=[
{name:"Matemática",score:"41,7%",detail:"15/36 questões",status:"Base prioritária",topics:["Operações e frações","Razão e proporção","Álgebra básica","Fatoração","Função quadrática","Geometria"]},
{name:"Física",score:"54,2%",detail:"13/24 questões",status:"Base prioritária",topics:["Cinemática","Dinâmica","Trabalho e energia","Ondulatória","Eletricidade"]},
{name:"Química",score:"14/14",detail:"14 corretas · 16 sem resposta",status:"Reconstruir base",topics:["Estrutura atômica","Tabela periódica","Ligações químicas","Funções inorgânicas","Estequiometria","Química orgânica"]},
{name:"Biologia",score:"85%",detail:"17/20 questões",status:"Consolidar",topics:["Citologia","Mitose e meiose","Gametas","Genética e cruzamentos","Ecologia"]},
{name:"História",score:"96,7%",detail:"Três avaliações",status:"Manutenção",topics:["Brasil República","Era Vargas","Ditadura e redemocratização"]},
{name:"Geografia",score:"83,3%",detail:"25/30 questões",status:"Revisar pontos",topics:["Escala e orientação","Intemperismo","Cerrado","Hidrografia","Clima"]},
{name:"Português",score:"80,6%",detail:"50/62 questões",status:"Aprofundar gramática",topics:["Sintaxe","Transitividade verbal","Complementos","Regência","Crase","Interpretação"]},
{name:"Filosofia",score:"12/15",detail:"Validação adicional: 4/8",status:"Reforçar raciocínio",topics:["Kant","Utilitarismo","Silogismo","Lógica"]},
{name:"Redação",score:"—",detail:"Autoavaliação: 4/10",status:"Prática orientada",topics:["Competências do ENEM","Tese e projeto de texto","Argumentação","Repertório","Proposta de intervenção"]},
{name:"Sociologia",score:"Pendente",detail:"Sem diagnóstico",status:"Diagnosticar",topics:["Cultura","Trabalho","Desigualdade","Estado e poder"]},
{name:"Artes",score:"Pendente",detail:"Sem diagnóstico",status:"Diagnosticar",topics:["Arte brasileira","Movimentos artísticos","Leitura de imagens"]}
];
let logs=JSON.parse(localStorage.getItem("ce_logs")||"[]"),reviews=JSON.parse(localStorage.getItem("ce_reviews")||"[]");
const $=s=>document.querySelector(s);
function save(){localStorage.setItem("ce_logs",JSON.stringify(logs));localStorage.setItem("ce_reviews",JSON.stringify(reviews))}
function page(name){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===name));$("#crumb").textContent=({inicio:"VISÃO GERAL",plano:"PLANO DE ESTUDOS",materias:"MATÉRIAS E TRILHAS",diagnostico:"DIAGNÓSTICO",sessoes:"SESSÕES REGISTRADAS",revisoes:"REVISÕES"})[name];render(name)}
function render(name="inicio"){
let root=$("#view");
if(name==="inicio"){let hours=logs.reduce((a,x)=>a+Number(x.minutes||0),0)/60;root.innerHTML=`<div class="heading"><div><div class="eyebrow">ENEM 2026 · PAINEL PESSOAL</div><h1>Visão geral</h1><p>Estude com direção. Use os dados para decidir o próximo passo.</p></div><button class="primary" onclick="modalSession()">Registrar estudo</button></div>
<div class="grid"><div class="card"><div class="muted">Sessões registradas</div><div class="metric">${logs.length}</div><small class="muted">Histórico neste dispositivo</small></div><div class="card"><div class="muted">Tempo acumulado</div><div class="metric">${hours.toFixed(1).replace(".",",")}h</div><small class="muted">Com base nos registros</small></div><div class="card"><div class="muted">Matérias mapeadas</div><div class="metric">11</div><small class="muted">Trilhas iniciais</small></div><div class="card"><div class="muted">Revisões pendentes</div><div class="metric">${reviews.filter(x=>!x.done).length}</div><small class="muted">D+1, D+7 e D+14</small></div></div>
<div class="split section"><div class="card"><h2>Prioridades identificadas</h2><div class="subject-list">${subjects.slice(0,4).map(s=>`<div class="subject"><div><b>${s.name}</b><div class="muted">${s.detail}</div></div><span class="tag">${s.status}</span></div>`).join("")}</div></div><div class="card"><h2>Regra operacional</h2><p class="muted">Uma sessão só conta como estudo efetivo quando há esforço de recuperação, resolução ou explicação do conteúdo — não apenas leitura passiva.</p><div class="notice">Ao errar, registre a causa: lacuna conceitual, interpretação, procedimento, distração ou falta de tempo.</div></div></div>
<div class="section card"><h2>Últimas sessões</h2>${logs.length?logTable(logs.slice(-5).reverse()):'<div class="empty">Nenhuma sessão registrada. Registre a primeira para iniciar seu histórico.</div>'}</div>`}
if(name==="materias"){root.innerHTML=`<div class="heading"><div><div class="eyebrow">MAPA DE CONTEÚDO</div><h1>Matérias e trilhas</h1><p>Use os tópicos como mapa inicial; avance conforme evidências de domínio.</p></div></div><div class="subject-list">${subjects.map((s,i)=>`<details class="card"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:12px"><b>${s.name}</b><span class="tag">${s.status}</span></summary><p class="muted">${s.score} · ${s.detail}</p><div class="subject-list">${s.topics.map(t=>`<div class="subject"><span>${t}</span><button class="secondary" onclick="addReview('${s.name}','${t.replace(/'/g,"\\'")}')">＋ Revisar</button></div>`).join("")}</div></details>`).join("")}</div>`}
if(name==="diagnostico"){root.innerHTML=`<div class="heading"><div><div class="eyebrow">PONTO DE PARTIDA</div><h1>Diagnóstico</h1><p>Resultados anotados a partir dos registros de estudo já fornecidos.</p></div></div><div class="card"><table class="table"><thead><tr><th>Matéria</th><th>Resultado</th><th>Leitura atual</th></tr></thead><tbody>${subjects.map(s=>`<tr><td><b>${s.name}</b></td><td>${s.score}</td><td>${s.status}</td></tr>`).join("")}</tbody></table></div><p class="notice section">Os percentuais são os dados de referência disponíveis, não uma estimativa automática de nota TRI. Questões não respondidas e questões erradas precisam ser analisadas separadamente.</p>`}
if(name==="plano"){root.innerHTML=`<div class="heading"><div><div class="eyebrow">ROTINA EXECUTÁVEL</div><h1>Plano de estudos</h1><p>Estrutura-base compatível com blocos curtos durante a semana.</p></div></div><div class="grid"><div class="card"><b>Segunda</b><p class="muted">Matemática · base e exercícios</p></div><div class="card"><b>Terça</b><p class="muted">Linguagens · leitura e gramática</p></div><div class="card"><b>Quarta</b><p class="muted">Física ou Química · teoria aplicada</p></div><div class="card"><b>Quinta</b><p class="muted">Biologia e Humanas · questões</p></div><div class="card"><b>Sexta</b><p class="muted">Redação · repertório e escrita</p></div><div class="card"><b>Fim de semana</b><p class="muted">Simulado, correção e revisões</p></div></div><div class="card section"><h2>Estrutura sugerida para uma sessão de 2 horas</h2><p class="muted">10 min — recuperação do que estudou anteriormente. 35 min — estudo orientado. 40 min — questões sem consulta. 20 min — correção e classificação dos erros. 15 min — síntese e agendamento de revisões.</p><div class="notice">A rotina é uma referência inicial, não uma obrigação rígida. Ajuste o volume sem abandonar a prática de questões e a correção.</div></div>`}
if(name==="sessoes"){root.innerHTML=`<div class="heading"><div><div class="eyebrow">REGISTRO DE EXECUÇÃO</div><h1>Sessões registradas</h1><p>Histórico de tempo, conteúdo e desempenho.</p></div><button class="primary" onclick="modalSession()">＋ Nova sessão</button></div><div class="card">${logs.length?logTable(logs.slice().reverse()):'<div class="empty">Ainda não há registros.</div>'}</div>`}
if(name==="revisoes"){root.innerHTML=`<div class="heading"><div><div class="eyebrow">REPETIÇÃO ESPAÇADA</div><h1>Revisões</h1><p>Agende revisões em D+1, D+7 e D+14 para cada conteúdo.</p></div></div><div class="card">${reviews.length?'<div class="subject-list">'+reviews.map((r,i)=>`<div class="subject"><div><b>${r.topic}</b><div class="muted">${r.subject} · ${r.when}</div></div><label><input type="checkbox" style="width:auto" ${r.done?'checked':''} onchange="toggleReview(${i},this.checked)"> Concluída</label></div>`).join("")+'</div>':'<div class="empty">Nenhuma revisão agendada. Na página de matérias, use “Revisar” em um tópico.</div>'}</div>`}
}
function logTable(items){return '<table class="table"><thead><tr><th>Data</th><th>Matéria</th><th>Conteúdo</th><th>Tempo</th><th>Acertos</th></tr></thead><tbody>'+items.map(x=>`<tr><td>${x.date}</td><td>${x.subject}</td><td>${x.topic}</td><td>${x.minutes} min</td><td>${x.correct||"—"}/${x.total||"—"}</td></tr>`).join("")+'</tbody></table>'}
function modalSession(){let root=$("#view");root.innerHTML+=`<div class="card section" id="sessionForm"><h2>Registrar sessão de estudo</h2><div class="field"><label>Matéria</label><select id="fSubject">${subjects.map(s=>`<option>${s.name}</option>`).join("")}</select></div><div class="field"><label>Conteúdo estudado</label><input id="fTopic" placeholder="Ex.: função do 2º grau"></div><div class="grid"><div class="field"><label>Tempo (minutos)</label><input id="fMinutes" type="number" min="1" value="40"></div><div class="field"><label>Questões corretas</label><input id="fCorrect" type="number" min="0" placeholder="0"></div><div class="field"><label>Total de questões</label><input id="fTotal" type="number" min="0" placeholder="0"></div><div class="field"><label>Data</label><input id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Principal dificuldade / observação</label><textarea id="fNote" rows="2" placeholder="O que errou e por quê?"></textarea></div><button class="primary" onclick="saveSession()">Salvar sessão</button></div>`;$("#sessionForm").scrollIntoView({behavior:"smooth"})}
function saveSession(){let topic=$("#fTopic").value.trim();if(!topic){alert("Informe o conteúdo estudado.");return}let x={subject:$("#fSubject").value,topic,minutes:Number($("#fMinutes").value),correct:$("#fCorrect").value,total:$("#fTotal").value,date:$("#fDate").value,note:$("#fNote").value};logs.push(x);save();page("sessoes")}
function addReview(subject,topic){let d=new Date();d.setDate(d.getDate()+1);reviews.push({subject,topic,when:"D+1 · "+d.toLocaleDateString("pt-BR"),done:false});d=new Date();d.setDate(d.getDate()+7);reviews.push({subject,topic,when:"D+7 · "+d.toLocaleDateString("pt-BR"),done:false});d=new Date();d.setDate(d.getDate()+14);reviews.push({subject,topic,when:"D+14 · "+d.toLocaleDateString("pt-BR"),done:false});save();alert("Três revisões adicionadas.");}
function toggleReview(i,v){reviews[i].done=v;save();page("revisoes")}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)page(b.dataset.page)});
$("#quickSession").onclick=()=>{page("sessoes");modalSession()};
$("#menuBtn").onclick=()=>{let n=prompt("Digite: inicio, plano, materias, diagnostico, sessoes ou revisoes");if(n&&["inicio","plano","materias","diagnostico","sessoes","revisoes"].includes(n))page(n)};
page("inicio");
</script></body></html>
